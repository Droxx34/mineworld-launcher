name: Construction

# (13/11/2026) MineWorld : Windows d'abord. À chaque envoi sur main, l'installateur est publié dans « Releases »
# sous la version de package.json (v0.1.0…) : changer la version pour publier une nouvelle version du launcher.
# Les envois sur une autre branche fabriquent seulement l'installateur (à télécharger dans « Actions »).
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Dépendances
        run: npm ci
        shell: bash
      - name: Installateur (sans publier)
        if: ${{ github.ref != 'refs/heads/main' }}
        run: npm run dist:win -- --publish never
        shell: bash
      - name: Installateur publié (version de package.json)
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish always
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: MineWorld-Launcher-Windows
          path: dist/*.exe
          if-no-files-found: error
